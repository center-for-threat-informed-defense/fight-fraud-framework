name: Build Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('f3-preview-{0}', github.event.number) || 'f3-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ${{ github.event_name == 'pull_request' && format('/pr-{0}/', github.event.number) || '/fightfraud/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          npm ci
          pip install stix2
      - name: Generate data
        run: |
          npm run update
          npm run generate:stix
          npm run generate:navigator
          npm run archive:json
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build website
        run: npm run build-only -- --base "$BASE_PATH"
      - name: Verify website
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/f3-v1.json
          test -s dist/f3-stix.json
          test -s dist/f3-navigator.json
          test -s 'dist/MITRE F3 Design Principles and Methodology.pdf'
          compgen -G 'dist/assets/*.js' > /dev/null
          compgen -G 'dist/assets/*.css' > /dev/null
          grep -Fq "$BASE_PATH" dist/index.html
      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: f3-website
          path: dist/
          retention-days: 1

  deploy_production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://ctid.mitre.org/fightfraud/
    env:
      AZURE_STATIC_WEBSITE_ENDPOINT: ${{ vars.AZURE_STATIC_WEBSITE_ENDPOINT }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: $web
    steps:
      - name: Download website
        uses: actions/download-artifact@v4
        with:
          name: f3-website
          path: dist
      - name: Verify deployment source
        run: |
          test -s dist/index.html
          test -s dist/404.html
          compgen -G 'dist/assets/*.js' > /dev/null
          compgen -G 'dist/assets/*.css' > /dev/null
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Synchronize static website
        run: |
          account=$(printf '%s' "$AZURE_STORAGE_ACCOUNT" | tr -d '[:space:]')
          test -n "$account"
          az storage blob sync \
            --account-name "$account" \
            --container "$AZURE_STORAGE_CONTAINER" \
            --source dist \
            --auth-mode login \
            --delete-destination true \
            --only-show-errors
      - name: Verify static website
        run: |
          endpoint=$(printf '%s' "$AZURE_STATIC_WEBSITE_ENDPOINT" | tr -d '[:space:]')
          endpoint="${endpoint%/}"
          test -n "$endpoint"

          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/" > /dev/null

          assets=(dist/assets/*.js dist/assets/*.css)
          for asset in "${assets[@]}"; do
            curl --fail --silent --show-error --retry 6 --retry-delay 10 \
              "$endpoint/${asset#dist/}" > /dev/null
          done

          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/f3-stix.json" > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/MITRE%20F3%20Design%20Principles%20and%20Methodology.pdf" > /dev/null

          status=$(curl --silent --show-error --output /tmp/f3-404.html \
            --write-out '%{http_code}' "$endpoint/not-a-real-page")
          test "$status" = '404'
          grep -Fq 'Page Not Found' /tmp/f3-404.html

  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_PREVIEW_STORAGE_ACCOUNT || 'mappingsexplorerfinsec' }}
      AZURE_STORAGE_CONTAINER: $web
      PREVIEW_PATH: pr-${{ github.event.number }}
      PREVIEW_ENDPOINT: ${{ vars.AZURE_PREVIEW_STATIC_WEBSITE_ENDPOINT || 'https://mappingsexplorerfinsec.z13.web.core.windows.net' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install StatiCrypt
        run: npm install --global staticrypt@3.5.4
      - name: Download website
        uses: actions/download-artifact@v4
        with:
          name: f3-website
          path: f3-website
      - name: Encrypt HTML files
        env:
          STATICRYPT_PASS: ${{ secrets.STATICRYPT_PASS }}
        run: |
          staticrypt --remember 3 --salt b1c18fbb5081eca3e2db08a413b01774 \
            --password "$STATICRYPT_PASS" --short \
            --template-title "MITRE Fight Fraud Framework (preview: $PREVIEW_PATH)" \
            --template-instructions "HTML pages are password-protected; linked downloads may remain directly accessible." \
            --template-color-primary "#005B94" \
            --template-color-secondary "#b2b2b2" \
            --template-button "Log In" \
            -r f3-website/
          test -s encrypted/f3-website/index.html
          test -s encrypted/f3-website/404.html
          ! cmp -s f3-website/index.html encrypted/f3-website/index.html
      - name: Copy encrypted HTML files
        run: rsync -Ir --include='*.html' --exclude='*.*' encrypted/f3-website .
      - name: Prepare preview directory
        run: mv f3-website "$PREVIEW_PATH"
      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Synchronize preview
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
        run: |
          az storage blob delete-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --source "$AZURE_STORAGE_CONTAINER" \
            --pattern "$PREVIEW_PATH/*" \
            --only-show-errors
          az storage blob upload-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --source . \
            --destination "$AZURE_STORAGE_CONTAINER" \
            --pattern "$PREVIEW_PATH/*" \
            --overwrite \
            --only-show-errors
      - name: Verify preview
        run: |
          endpoint=$(printf '%s' "$PREVIEW_ENDPOINT" | tr -d '[:space:]')
          endpoint="${endpoint%/}"
          test -n "$endpoint"

          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/$PREVIEW_PATH/" > /tmp/f3-preview.html
          grep -Fq 'MITRE Fight Fraud Framework' /tmp/f3-preview.html

          assets=("$PREVIEW_PATH"/assets/*.js)
          test -s "${assets[0]}"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/${assets[0]}" > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/$PREVIEW_PATH/f3-stix.json" > /dev/null
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = process.env.PREVIEW_ENDPOINT.replace(/\/+$/, "");
            const path = process.env.PREVIEW_PATH;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `This PR has been published to ${endpoint}/${path}/`,
            });
